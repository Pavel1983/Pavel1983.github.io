<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pavel Totolin</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0 auto;
      max-width: 40rem;
      padding: 2rem 1.25rem;
      font: 1.05rem/1.5 system-ui, sans-serif;
    }
    h1 { font-size: 1.75rem; }
    ul { padding-left: 1.2rem; }
    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      opacity: 0.75;
    }
    #visit-count {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <h1>Pavel Totolin</h1>
  <p>Independent app developer.</p>
  <h2>Apps</h2>
  <ul>
    <li>
      <a href="/times-tables-practice/">Times Tables Practice</a>
      — multiplication tables for children
    </li>
  </ul>
  <footer>
    <p>Visitors: <span id="visit-count">…</span></p>
  </footer>
  <script>
    (function () {
      var el = document.getElementById('visit-count');
      fetch('https://abacus.jasoncameron.dev/hit/paveltotolin.dev/visits')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && typeof data.value === 'number') {
            el.textContent = data.value.toLocaleString('en-US');
          } else {
            el.textContent = '—';
          }
        })
        .catch(function () {
          el.textContent = '—';
        });
    })();
  </script>
</body>
</html>
